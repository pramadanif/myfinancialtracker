version: "3.8"

services:
  finance-tracker:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/data/prod.db
      - SESSION_SECRET=${SESSION_SECRET:-change-this-to-a-random-32-char-secret}
      - APP_PASSWORD=${APP_PASSWORD:-admin123}
    volumes:
      - finance-data:/app/data
    restart: unless-stopped

volumes:
  finance-data:
    driver: local
